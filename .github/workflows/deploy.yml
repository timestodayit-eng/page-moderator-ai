# Push to `main` → tests run on GitHub → if green, the VPS pulls and redeploys itself.
#
# One-time setup (GitHub → repo → Settings → Secrets and variables → Actions → New repository secret):
#   VPS_HOST      your server IP
#   VPS_USER      root (or the deploy user)
#   VPS_SSH_KEY   private key whose public half is in ~/.ssh/authorized_keys on the VPS (see docs/DEPLOYMENT.md §10)
#   VPS_APP_DIR   /opt/page-moderator-ai
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pm_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npx prisma migrate deploy
        env: { DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pm_test }
      - run: npm test
      - run: npm run build
        env:
          APP_URL: https://build.invalid
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          APP_STAGE: local

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Pull and redeploy on the VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --all --prune
            git reset --hard origin/main
            ./docker/deploy.sh
