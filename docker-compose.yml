# Page Moderator AI — production compose for a single VPS (Hostinger, ~1 vCPU / 4 GB).
# PostgreSQL and Redis are NOT published to the host network; only Caddy exposes 80/443.
name: page-moderator-ai

x-app-env: &app-env
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:-pm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pm}
    REDIS_URL: redis://redis:6379
    STORAGE_LOCAL_DIR: /app/storage
    TRUST_PROXY: "true"
    SECURE_COOKIES: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-pm}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pm} -d ${POSTGRES_DB:-pm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no `ports:` on purpose — internal network only

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build: { context: ., target: web }
    image: page-moderator-ai:latest
    <<: *app-env
    command: ["sh", "-c", "npx prisma migrate deploy && npx tsx prisma/seed.ts"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  web:
    image: page-moderator-ai:latest
    <<: *app-env
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - storage:/app/storage
    expose: ["3000"]
    deploy:
      resources:
        limits: { memory: 1200m }

  worker:
    image: page-moderator-ai:latest
    <<: *app-env
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const t=Date.now();process.exit(0)\""]
      interval: 60s
    deploy:
      resources:
        limits: { memory: 800m }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env (e.g. app.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  storage:
  caddy_data:
  caddy_config:
